[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "life-os-server"
version = "0.1.0"
description = "Personal Life OS synchronization server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jsonschema[format]>=4.23,<5",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "certifi>=2024.2.2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["life_os*"]

[tool.setuptools.package-data]
life_os = ["migrations/*.sql", "migrations/postgres/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
